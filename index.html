/* union across the client's days (deduped by term) */
function isAsinTerm(t){return /^b0[a-z0-9]{8}$/i.test(t||'');}
function kindOf(k){return k.kind||(isAsinTerm(k.term)?'asin':'keyword');}
function prodOf(k){return k.product||'General (unassigned)';}
function negProducts(c){
  if(c.products&&c.products.length) return c.products.map(p=>p.name||p);
  const s=new Set(); (c.days||[]).forEach(d=>(d.candidates||[]).forEach(k=>s.add(prodOf(k)))); return [...s];
}
function unionOf(c){
  const days=c.days||[]; const map=new Map();
  days.forEach(d=>{(d.candidates||[]).forEach(k=>{
    const key=k.term.toLowerCase();
    if(!map.has(key)){
      map.set(key,{term:k.term,clicks:k.clicks,spend:k.spend,match:k.match,root:k.root,reason:k.reason,
        kind:kindOf(k),product:prodOf(k),days_count:1,first_seen:d.date_label,last_seen:d.date_label});
    }else{
      const u=map.get(key); u.clicks+=k.clicks; u.spend=+(u.spend+k.spend).toFixed(2);
      u.days_count++; u.first_seen=d.date_label;
    }
  })});
  return [...map.values()].sort((a,b)=>b.spend-a.spend);
}

function negCheckedDays(ci,c){return [...c._panel.querySelectorAll('#daychks-'+ci+' input[data-day]')].filter(x=>x.checked).map(x=>+x.dataset.day);}
function unionDays(c,idxs){
  const days=c.days||[]; const map=new Map();
  idxs.forEach(i=>{const d=days[i]; if(!d)return; (d.candidates||[]).forEach(k=>{
    const key=k.term.toLowerCase();
    if(!map.has(key)) map.set(key,{term:k.term,clicks:k.clicks,spend:k.spend,match:k.match,root:k.root,reason:k.reason,kind:kindOf(k),product:prodOf(k),days_count:1,first_seen:d.date_label,last_seen:d.date_label});
    else{const u=map.get(key);u.clicks+=k.clicks;u.spend=+(u.spend+k.spend).toFixed(2);u.days_count++;u.first_seen=d.date_label;}
  });});
  return [...map.values()].sort((a,b)=>b.spend-a.spend);
}
function currentList(ci,c){ return unionDays(c, negCheckedDays(ci,c)); }
function selectView(ci,c){
  const cp=c.currency_prefix||'$';
  const idxs=negCheckedDays(ci,c);
  const list=currentList(ci,c); c._view=list;
  list.forEach(k=>{ if(!k.kind)k.kind=kindOf(k); if(!k.product)k.product=prodOf(k); });
  const tb=c._panel.querySelector('tbody'); tb.innerHTML='';
  const multi=idxs.length>1;
  let meta='';
  if(!idxs.length){ meta='No day selected - select at least one above.'; }
  else if(idxs.length===1){ const d=c.days[idxs[0]]; meta=`${(d&&(d.window_label||d.date_label))||''} - day pool: ${(d&&d.pool_total)||0} zero-sale (${money((d&&d.pool_spend)||0,cp)})`; }
  else{ meta=`Union of ${idxs.length} selected days - ${list.length} terms (deduplicated)`; }
  $('#daymeta-'+ci).textContent=meta;

  const kf=$('#kind-'+ci).value, pf=$('#prod-'+ci).value;
  const rows=list.map((k,ki)=>({k,ki})).filter(o=>(kf==='__all'||o.k.kind===kf)&&(pf==='__all'||o.k.product===pf));

  const mkRow=(o)=>{
    const k=o.k; const tr=el('tr'); tr.dataset.i=o.ki; const isA=k.kind==='asin';
    const seen = multi && k.days_count ? `<div class="seen">${k.days_count} day/s - since ${k.first_seen}</div>` : '';
    const psel=`<select class="prodsel" data-prod>${c._prods.map(n=>`<option ${n===k.product?'selected':''}>${escapeHtml(n)}</option>`).join('')}</select>`;
    const tog=isA?`<span class="reason r-other">product target</span>`
      :`<span class="tog"><button data-m="phrase" class="${k.match==='phrase'?'on':''}">Phrase</button><button data-m="exact" class="${k.match==='exact'?'on ex':''}">Exact</button></span>`;
    tr.innerHTML=`<td><input type="checkbox" checked data-cb></td>
      <td class="term"><div class="t">${escapeHtml(k.term)}</div>${k.root?`<div class="dim" style="font-size:11px">root: <b>${escapeHtml(k.root)}</b></div>`:''}${seen}</td>
      <td class="num">${k.clicks}</td><td class="num">${money(k.spend,cp)}</td>
      <td><span class="reason ${REASONCLS(k.reason)}">${k.reason}</span></td>
      <td>${psel}</td><td>${tog}</td>`;
    if(!isA){const toks=tr.querySelectorAll('.tog button');toks.forEach(b=>b.onclick=()=>{k.match=b.dataset.m;toks.forEach(x=>x.classList.remove('on','ex'));b.classList.add('on');if(k.match==='exact')b.classList.add('ex');});}
    const ps=tr.querySelector('[data-prod]'); ps.onchange=()=>{k.product=ps.value;selectView(ci,c);};
    const cb=tr.querySelector('[data-cb]'); cb.onchange=()=>{tr.classList.toggle('off',!cb.checked);updSel(ci,c);};
    return tr;
  };
  const kw=rows.filter(o=>o.k.kind!=='asin'), as=rows.filter(o=>o.k.kind==='asin');
  if(kw.length){const sr=el('tr','secrow');sr.innerHTML=`<td colspan="7">KEYWORDS (${kw.length})</td>`;tb.appendChild(sr);kw.forEach(o=>tb.appendChild(mkRow(o)));}
  if(as.length){const sr=el('tr','secrow');sr.innerHTML=`<td colspan="7">ASINs / product targets (${as.length})</td>`;tb.appendChild(sr);as.forEach(o=>tb.appendChild(mkRow(o)));}
  $('#empty-'+ci).textContent = rows.length? '' : 'No candidates for this view/filters.';
  $('#out-'+ci).classList.remove('show');
  updSel(ci,c);
}
function negRows(c){return [...c._panel.querySelectorAll('tbody tr')].filter(tr=>tr.querySelector('[data-cb]'));}
function selectedRows(ci,c){
  const list=c._view||[];
  return negRows(c).filter(tr=>tr.querySelector('[data-cb]').checked).map(tr=>list[+tr.dataset.i]);
}
function updSel(ci,c){
  const cp=c.currency_prefix||'$'; const dr=negRows(c);
  const sel=dr.filter(tr=>tr.querySelector('[data-cb]').checked).map(tr=>(c._view||[])[+tr.dataset.i]);
  $('#selc-'+ci).textContent=`${sel.length} selected`;
  $('#cnt-'+ci).textContent=dr.length;
  $('#save-'+ci).textContent=money(sel.reduce((a,k)=>a+(k.spend||0),0),cp);
}
function genBlocks(ci,c){
  const rows=selectedRows(ci,c);
  const kw=rows.filter(k=>k.kind!=='asin');
  const phrase=[...new Set(kw.filter(k=>k.match==='phrase').map(k=>((k.root&&k.root.length)?k.root:k.term).toLowerCase().trim()))].sort();
  const exact=[...new Set(kw.filter(k=>k.match==='exact').map(k=>k.term.toLowerCase().trim()))].sort();
  const asins=[...new Set(rows.filter(k=>k.kind==='asin').map(k=>k.term.toUpperCase().trim()))].sort();
  const learn=rows.map(k=>`${k.term}\t${k.kind==='asin'?'asin':k.match}\t${k.reason}\t${k.product}`);
  $('#ph-'+ci).value=phrase.join('\n'); $('#ex-'+ci).value=exact.join('\n'); $('#as-'+ci).value=asins.join('\n'); $('#lr-'+ci).value=learn.join('\n');
  $('#out-'+ci).classList.add('show'); $('#out-'+ci).scrollIntoView({behavior:'smooth',block:'nearest'});
}
function copyTa(id,btn){const ta=$('#'+id);ta.focus();ta.select();try{ta.setSelectionRange(0,999999);}catch(e){}
  const ok=()=>{const o=btn.textContent;btn.textContent='Copied!';setTimeout(()=>btn.textContent=o,1200);};
  const fb=()=>{try{document.execCommand('copy');ok();}catch(e){btn.textContent='Select and Ctrl+C';setTimeout(()=>btn.textContent='Copy',1600);}};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(ta.value).then(ok).catch(fb);}else{fb();}}

    '<div class="kpi"><div class="n teal">'+(cnt.total!=null?cnt.total:prop.length)+'</div><div class="l">Total</div></div>'+
    '<div class="kpi"><div class="n">'+(cnt.bids!=null?cnt.bids:'-')+'</div><div class="l">Bids</div></div>'+
    '<div class="kpi"><div class="n">'+(cnt.placements!=null?cnt.placements:'-')+'</div><div class="l">Placements</div></div>'+
    '<div class="kpi"><div class="n green">'+(cnt.up!=null?cnt.up:'-')+'</div><div class="l">Suben</div></div>'+
    '<div class="kpi"><div class="n amber">'+(cnt.capped!=null?cnt.capped:'-')+'</div><div class="l">Capeadas</div></div>'+
    '</div>';
  panel.appendChild(head);

  if(days.length>1){
    var runbar=el('div'); runbar.style.cssText='margin:2px 0 10px;display:flex;align-items:center;gap:8px';
    runbar.innerHTML='<span style="color:var(--mut);font-size:12px">Run</span>';
    var rsel=document.createElement('select');
    rsel.innerHTML=days.map(function(dd,i){return '<option value="'+i+'"'+(i===ri?' selected':'')+'>'+esc(dd.fecha||dd.generated_at_iso||('run '+(i+1)))+(i===0?' (ultimo)':'')+(dd.status==='applied'?' - applied':'')+'</option>';}).join('');
    rsel.onchange=function(e){ST._run[CURRENT]=+e.target.value;renderOptimizations();};
    runbar.appendChild(rsel); panel.appendChild(runbar);
  }

  var tb=el('div'); tb.style.cssText='display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0 12px;padding:10px;background:var(--panel2,#1c232c);border-radius:9px';
  tb.innerHTML='<input type="search" id="opt-q" placeholder="Filtrar por campana / target..." value="'+esc(F.q)+'" style="flex:1;min-width:150px;background:var(--panel2,#1c232c);color:inherit;border:1px solid var(--line,#2b333d);border-radius:7px;padding:6px 9px">'+
    '<select id="opt-kind" style="'+CO+'"><option value="all">Todos</option><option value="bid"'+(F.kind==='bid'?' selected':'')+'>Solo bids</option><option value="placement"'+(F.kind==='placement'?' selected':'')+'>Solo placements</option></select>'+
    '<select id="opt-dir" style="'+CO+'"><option value="all">Sube y baja</option><option value="up"'+(F.dir==='up'?' selected':'')+'>Solo suben</option><option value="down"'+(F.dir==='down'?' selected':'')+'>Solo bajan</option></select>'+
    '<label style="font-size:12px;color:var(--mut)"><input type="checkbox" id="opt-cap"'+(F.capped?' checked':'')+'> solo capeadas</label>'+
    '<label style="font-size:12px;color:var(--mut)"><input type="checkbox" id="opt-rout"'+(F.hideRoutine?' checked':'')+'> ocultar rutina (+low&nbsp;visibility)</label>'+
    '<button id="opt-selv" style="'+CO+'">Tildar visibles</button>'+
    '<button id="opt-desv" style="'+CO+'">Des-tildar visibles</button>';
  panel.appendChild(tb);

  var routineCount=prop.filter(isRoutine).length;
  if(F.hideRoutine&&routineCount){
    var bn=el('div'); bn.style.cssText='margin:0 0 10px;padding:8px 11px;border:1px dashed var(--line,#2b333d);border-radius:8px;color:var(--mut);font-size:12px';
    bn.innerHTML='&#9656; <b style="color:var(--txt,#e6edf3)">'+routineCount+'</b> bumps de rutina (+low visibility) ocultos y <b style="color:var(--green)">aprobados</b>. <a href="#" id="opt-showr" style="color:var(--teal)">mostrar</a>';
    panel.appendChild(bn);
  }

  var q=(F.q||'').toLowerCase();
  var vis=prop.filter(function(r){
    if(F.hideRoutine&&isRoutine(r))return false;
    if(F.kind!=='all'&&r.kind!==F.kind)return false;
    if(F.dir==='up'&&!(r.new>r.old))return false;
    if(F.dir==='down'&&!(r.new<r.old))return false;
    if(F.capped&&!r.cap)return false;
    if(q){var hay=((camps[r.ci]||'')+' '+(r.tgt||'')+' '+(r.ag||'')).toLowerCase();if(hay.indexOf(q)<0)return false;}
    return true;
  });

  var groups={}; vis.forEach(function(r){(groups[r.ci]=groups[r.ci]||[]).push(r);});
  var body=el('div');
  Object.keys(groups).forEach(function(ci){
    var rows=groups[ci]; var cname=camps[ci]||('camp '+ci);
    var closed=(ST._open[ci]===false);
    var g=el('div'); g.style.cssText='border:1px solid var(--line,#2b333d);border-radius:9px;margin-bottom:9px;overflow:hidden';
    var gApproved=rows.filter(function(r){return !ex.has(rk(r));}).length;
    var gh=el('div'); gh.style.cssText='display:flex;align-items:center;gap:9px;padding:8px 11px;background:var(--panel2,#1c232c);cursor:pointer;user-select:none';
    gh.innerHTML='<input type="checkbox" class="gcbx"'+(gApproved===rows.length?' checked':'')+'><span style="color:var(--dim,#5b6673)">'+(closed?'&#9656;':'&#9660;')+'</span>'+
      '<span style="font-weight:600;font-size:13px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="'+esc(cname)+'">'+esc(cname)+'</span>'+
      '<span style="color:var(--mut);font-size:12px">'+gApproved+'/'+rows.length+'</span>';
    var gcbx=gh.querySelector('.gcbx'); if(gApproved>0&&gApproved<rows.length)gcbx.indeterminate=true;
    gcbx.onclick=function(e){e.stopPropagation();var on=e.target.checked;rows.forEach(function(r){if(on)ex.delete(rk(r));else ex.add(rk(r));});renderOptimizations();};
    gh.onclick=function(e){if(e.target.classList.contains('gcbx'))return;ST._open[ci]=(ST._open[ci]===false)?true:false;renderOptimizations();};
    g.appendChild(gh);

    if(!closed){
      var tbl=el('div'); tbl.style.cssText='overflow-x:auto';
      var rowsHtml=rows.map(function(r){
        var off=ex.has(rk(r)); var dir=r.new>r.old?'green':(r.new<r.old?'#f26d6d':'var(--mut)');
        var isPl=(r.kind==='placement'); var fmt=function(v){return isPl?(Number(v).toFixed(2)+'x'):money(v);};
        var pill=isPl?('<span style="font-size:10.5px;padding:1px 6px;border-radius:5px;background:var(--panel2,#1c232c);color:var(--blue,#58a6ff)">'+esc(r.be.replace('PLACEMENT_','PL '))+'</span>')
          :('<span style="font-size:10.5px;padding:1px 6px;border-radius:5px;background:var(--panel2,#1c232c);color:var(--mut)">'+esc(r.be.toLowerCase())+'</span>');
        return '<tr data-k="'+esc(rk(r))+'" style="'+(off?'opacity:.45':'')+'">'+
          '<td style="padding:6px 9px;border-top:1px solid var(--line,#2b333d)"><input type="checkbox" class="rcbx" data-k="'+esc(rk(r))+'"'+(off?'':' checked')+'></td>'+
          '<td style="padding:6px 9px;border-top:1px solid var(--line,#2b333d);max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="'+esc(r.ag||camps[r.ci])+'">'+esc(r.ag||'-')+'</td>'+
          '<td style="padding:6px 9px;border-top:1px solid var(--line,#2b333d);max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="'+esc(r.tgt)+'">'+esc(r.tgt||(isPl?r.be.replace('PLACEMENT_','').toLowerCase():'-'))+'</td>'+
          '<td style="padding:6px 9px;border-top:1px solid var(--line,#2b333d)">'+pill+'</td>'+
          '<td style="padding:6px 9px;border-top:1px solid var(--line,#2b333d);white-space:nowrap">'+fmt(r.old)+' <span style="color:var(--dim,#5b6673)">&rarr;</span> <b style="color:'+dir+'">'+fmt(r.new)+'</b></td>'+
          '<td style="padding:6px 9px;border-top:1px solid var(--line,#2b333d);color:'+dir+'">'+pctd(r.old,r.new)+'</td>'+
          '<td style="padding:6px 9px;border-top:1px solid var(--line,#2b333d);color:var(--mut);font-size:11.5px">'+esc(String(r.why||'').replace(/_/g,' ').toLowerCase())+'</td>'+
          '<td style="padding:6px 9px;border-top:1px solid var(--line,#2b333d);color:var(--amber);font-size:10.5px">'+(r.cap?esc(String(r.cap).replace(/_/g,' ').toLowerCase().replace('max ','')):'')+'</td>'+
          '</tr>';
      }).join('');
      tbl.innerHTML='<table style="width:100%;border-collapse:collapse;font-size:12.5px"><thead><tr style="color:var(--mut);font-size:11px;text-transform:uppercase">'+
        '<th style="padding:6px 9px;text-align:left"></th><th style="padding:6px 9px;text-align:left">Ad group</th><th style="padding:6px 9px;text-align:left">Target</th><th style="padding:6px 9px;text-align:left">Tipo</th><th style="padding:6px 9px;text-align:left">Old &rarr; New</th><th style="padding:6px 9px;text-align:left">&Delta;</th><th style="padding:6px 9px;text-align:left">Motivo</th><th style="padding:6px 9px;text-align:left">Cap</th>'+
        '</tr></thead><tbody>'+rowsHtml+'</tbody></table>';
      tbl.querySelectorAll('.rcbx').forEach(function(cb){cb.onclick=function(e){var k=e.target.getAttribute('data-k');if(e.target.checked)ex.delete(k);else ex.add(k);renderOptimizations();};});
      g.appendChild(tbl);
    }
    body.appendChild(g);
  });
  if(!vis.length)body.innerHTML='<div style="color:var(--mut);font-size:13px;padding:12px">Ningun cambio matchea el filtro.</div>';
  panel.appendChild(body);

  var approved=prop.filter(function(r){return !ex.has(rk(r));});
  var ft=el('div'); ft.style.cssText='margin-top:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap';
  var copyBtn=document.createElement('button');
  copyBtn.textContent='Copiar aprobados ('+approved.length+')';
  copyBtn.style.cssText='padding:6px 13px;border-radius:7px;border:1px solid var(--teal);background:var(--teal);color:#04201c;font-weight:700;cursor:pointer;font-size:12px';
  copyBtn.disabled=applied||!approved.length;
  copyBtn.onclick=function(){
    var ids=approved.map(function(r){return r.id+'|'+r.be;});
    var txt='aplica los bids aprobados de '+CURRENT+'\n'+ids.join('\n');
    if(navigator.clipboard)navigator.clipboard.writeText(txt);
    copyBtn.textContent='Copiado '+ids.length+' filas!'; setTimeout(function(){copyBtn.textContent='Copiar aprobados ('+approved.length+')';},1400);
  };
  ft.appendChild(copyBtn);
  var cs=el('div'); cs.style.cssText='color:var(--mut);font-size:12px;margin-left:auto';
  cs.innerHTML='<b style="color:var(--txt,#e6edf3)">'+approved.length+'</b> de '+prop.length+' aprobados ('+ex.size+' des-tildados)';
  ft.appendChild(cs);
  if(applied){var ab=el('span');ab.style.cssText='color:var(--green);font-weight:700;font-size:12px';ab.textContent='este run ya fue aplicado';ft.appendChild(ab);}
  panel.appendChild(ft);

  p.appendChild(panel);

  var qel=p.querySelector('#opt-q'); if(qel)qel.oninput=function(e){F.q=e.target.value;renderOptimizations();var n=p.querySelector('#opt-q');if(n){n.focus();n.setSelectionRange(n.value.length,n.value.length);}};
  var kel=p.querySelector('#opt-kind'); if(kel)kel.onchange=function(e){F.kind=e.target.value;renderOptimizations();};
  var del=p.querySelector('#opt-dir'); if(del)del.onchange=function(e){F.dir=e.target.value;renderOptimizations();};
  var cel=p.querySelector('#opt-cap'); if(cel)cel.onchange=function(e){F.capped=e.target.checked;renderOptimizations();};
  var rel=p.querySelector('#opt-rout'); if(rel)rel.onchange=function(e){F.hideRoutine=e.target.checked;renderOptimizations();};
  var shr=p.querySelector('#opt-showr'); if(shr)shr.onclick=function(e){e.preventDefault();F.hideRoutine=false;renderOptimizations();};
  var sv=p.querySelector('#opt-selv'); if(sv)sv.onclick=function(){vis.forEach(function(r){ex.delete(rk(r));});renderOptimizations();};
  var dv=p.querySelector('#opt-desv'); if(dv)dv.onclick=function(){vis.forEach(function(r){ex.add(rk(r));});renderOptimizations();};
}
function renderReview(){
  const p=$('#page-review'); if(!p) return; p.innerHTML='';
  const R=DATA.review||{clients:[]};
  const intro=el('div'); intro.style.cssText='margin-bottom:14px;color:var(--mut);font-size:13px';
  intro.innerHTML='Revision semanal (viernes): negativos ya aplicados que <b>podrian estar bloqueando '+
    'trafico relevante</b> y son <b>candidatos a archivar</b> (des-negativizar). Tilda los que quieras y '+
    'genera el bloque: es un comando listo para pegar en un chat que <b>archiva</b> esos negativos en AdLabs '+
    'y los <b>protege</b> (igualdad exacta) para que el push no los vuelva a negar. Archivar es IRREVERSIBLE.';
  p.appendChild(intro);

  function esa(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  function confRank(x){const c=(x||'').toLowerCase();return c==='high'?0:(c==='med'||c==='medium'?1:2);}
  function confChip(x){const c=(x||'').toLowerCase();
    const col=c==='high'?'var(--green)':(c==='med'||c==='medium'?'var(--amber)':'var(--dim)');
    const lbl=c==='high'?'alta':(c==='med'||c==='medium'?'media':(c==='low'?'baja':(x||'-')));
    return '<span style="color:'+col+';font-weight:700;font-size:12px">'+lbl+'</span>';}
  const btnCss='padding:4px 10px;border:1px solid var(--dim);border-radius:6px;background:transparent;color:inherit;cursor:pointer;font-size:12px';

  const sub=(R.clients||[]).filter(c=>c.brand_name===CURRENT);
  sub.forEach((c,ci)=>{
    const days=(c.days||[]).slice();
    const panel=el('div','client');

    const head=el('div','head');
    head.innerHTML=`<div><div class="name">${escapeHtml(c.brand_name)}<span class="mkt">${c.marketplace||''}</span></div>
      <div class="prod">Revision semanal - candidatos a archivar (des-negativizar)</div></div>
      <div class="kpis">
        <div class="kpi"><div class="n teal" id="rv-rev-${ci}">-</div><div class="l">Revisados</div></div>
        <div class="kpi"><div class="n amber" id="rv-prop-${ci}">-</div><div class="l">A archivar</div></div>
        <div class="kpi"><div class="n green" id="rv-arch-${ci}">-</div><div class="l">Archivados</div></div>
      </div>`;
    panel.appendChild(head);

    const bar=el('div','daybar');
    const dopts=days.map((d,di)=>`<option value="${di}">${d.date_iso||('rev '+(di+1))}${di===0?' (ultima)':''}</option>`).join('');
    bar.innerHTML=`<span class="lbl">Revision</span><select class="daysel" id="rv-day-${ci}">${dopts}</select>
      <span class="meta" id="rv-meta-${ci}"></span>`;
    panel.appendChild(bar);

    const body=el('div'); body.id='rv-body-'+ci; panel.appendChild(body);

    function renderDay(di){
      const d=days[di]||{};
      const prop=(d.proposal||[]).slice().sort((a,b)=>confRank(a.confidence)-confRank(b.confidence));
      const kept=d.excluded_kept||[];
      const dateIso=d.date_iso||'';
      $('#rv-rev-'+ci).textContent=(d.reviewed!=null?d.reviewed:'-');
      $('#rv-prop-'+ci).textContent=(d.proposed!=null?d.proposed:prop.length);
      $('#rv-arch-'+ci).textContent=(d.archived!=null?d.archived:0);
      $('#rv-meta-'+ci).textContent=(d.note||'');

      body.innerHTML='';

      const h1=el('div'); h1.style.cssText='font-weight:600;margin:6px 0 4px;color:var(--amber)';
      h1.innerHTML=`Candidatos a archivar (${prop.length})`;
      body.appendChild(h1);

      if(prop.length){
        const tb=el('div'); tb.style.cssText='display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0 8px';
        tb.innerHTML=`<span class="dim" style="font-size:12px">Seleccionar:</span>
          <button id="rv-all-${ci}" style="${btnCss}">Todos</button>
          <button id="rv-high-${ci}" style="${btnCss}">Solo alta confianza</button>
          <button id="rv-none-${ci}" style="${btnCss}">Ninguno</button>
          <span style="flex:1"></span>
          <button id="rv-gen-${ci}" style="${btnCss};border-color:var(--amber);color:var(--amber);font-weight:600">Generar bloque (<span id="rv-cnt-${ci}">0</span>)</button>`;
        body.appendChild(tb);

        const tw=el('div'); tw.style.overflowX='auto';
        const t=el('table');
        t.innerHTML='<thead><tr><th style="width:28px"></th><th class="term">Termino</th><th>Match</th>'+
          '<th class="num">Confianza</th><th>Producto / linea</th><th>Motivo</th></tr></thead>';
        const tbody=el('tbody');
        prop.forEach((x,xi)=>{
          const term=x.texto||x.term||'';
          const match=(x.match||x.kind||'').toString();
          tbody.appendChild(el('tr','',
            `<td><input type="checkbox" class="rv-pick" data-i="${xi}" data-term="${esa(term)}" data-match="${esa(match)}" data-conf="${esa(x.confidence||'')}"></td>`+
            `<td class="term">${escapeHtml(term)}</td>`+
            `<td>${escapeHtml(match)}</td>`+
            `<td class="num">${confChip(x.confidence)}</td>`+
            `<td>${escapeHtml(x.product||'')}</td>`+
            `<td class="dim">${escapeHtml(x.reason||'')}</td>`));
        });
        t.appendChild(tbody); tw.appendChild(t); body.appendChild(tw);

        const blk=el('div'); blk.id='rv-blk-'+ci; blk.hidden=true; blk.style.marginTop='10px';
        blk.innerHTML=`<div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
            <b style="font-size:13px">Bloque para pegar en un chat</b>
            <button id="rv-copy-${ci}" style="${btnCss}">Copiar</button>
            <span id="rv-copied-${ci}" class="dim" style="font-size:12px"></span></div>
          <textarea id="rv-ta-${ci}" readonly style="width:100%;min-height:150px;font-family:monospace;font-size:12px;box-sizing:border-box;padding:8px;border:1px solid var(--dim);border-radius:6px;background:transparent;color:inherit"></textarea>
          <div class="note" style="margin-top:6px">Pega este bloque en un chat con Claude (conectores Supabase + Adlabs). Archiva los negativos seleccionados en AdLabs y los agrega a protected_relevant como igualdad exacta. Es IRREVERSIBLE.</div>`;
        body.appendChild(blk);

        const picks=()=>Array.from(body.querySelectorAll('.rv-pick'));
        const updCnt=()=>{$('#rv-cnt-'+ci).textContent=picks().filter(p=>p.checked).length;};
        body.querySelectorAll('.rv-pick').forEach(cb=>cb.addEventListener('change',updCnt));
        $('#rv-all-'+ci).onclick=()=>{picks().forEach(p=>p.checked=true);updCnt();};
        $('#rv-none-'+ci).onclick=()=>{picks().forEach(p=>p.checked=false);updCnt();};
        $('#rv-high-'+ci).onclick=()=>{picks().forEach(p=>{p.checked=((p.getAttribute('data-conf')||'').toLowerCase()==='high');});updCnt();};
        $('#rv-gen-'+ci).onclick=()=>{
          const sel=picks().filter(p=>p.checked);
          const blkEl=$('#rv-blk-'+ci), ta=$('#rv-ta-'+ci);
          if(!sel.length){blkEl.hidden=false; ta.value='(No hay terminos seleccionados. Tilda al menos uno.)'; return;}
          const lines=sel.map(p=>'- "'+p.getAttribute('data-term')+'" ('+((p.getAttribute('data-match')||'').toUpperCase()||'EXACT')+')').join('\n');
          const txt=
            'Archiva y protege en '+c.brand_name+' estos negativos de la revision semanal'+(dateIso?(' ('+dateIso+')'):'')+'.\n'+
            'Para CADA termino de la lista: (1) archivalo en AdLabs (entity negative_targeting -> update_status ARCHIVED, solo estos, con su reference row-level) y '+
            '(2) agregalo a protected_relevant del perfil de relevancia de '+c.brand_name+' como IGUALDAD EXACTA (Exact), dedup por termino, con nota en change_log. '+
            'No archives ni protejas ningun otro negativo. Es irreversible; confirmo estos:\n'+lines;
          ta.value=txt; blkEl.hidden=false;
          ta.focus(); ta.select();
        };
        $('#rv-copy-'+ci).onclick=()=>{
          const ta=$('#rv-ta-'+ci); ta.select();
          const done=()=>{$('#rv-copied-'+ci).textContent='Copiado';setTimeout(()=>{$('#rv-copied-'+ci).textContent='';},2000);};
          if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(ta.value).then(done,()=>{try{document.execCommand('copy');done();}catch(e){}});}
          else{try{document.execCommand('copy');done();}catch(e){}}
        };
        updCnt();
      } else body.appendChild(el('div','empty','Sin candidatos a archivar esta semana. Los negativos aplicados no bloquean trafico relevante.'));

      if(kept.length){
        const h2=el('div'); h2.style.cssText='font-weight:600;margin:16px 0 4px;color:var(--dim)';
        h2.innerHTML=`Mantenidos negados pese a tocar un termino relevante (${kept.length})`;
        body.appendChild(h2);
        const tw2=el('div'); tw2.style.overflowX='auto';
        const t2=el('table');
        t2.innerHTML='<thead><tr><th class="term">Termino</th><th>Por que se mantiene negado</th></tr></thead>';
        const tb2=el('tbody');
        kept.forEach(x=>tb2.appendChild(el('tr','',
          `<td class="term">${escapeHtml(x.texto||x.term||'')}</td><td class="dim">${escapeHtml(x.reason||'')}</td>`)));
        t2.appendChild(tb2); tw2.appendChild(t2); body.appendChild(tw2);
      }
    }

    bar.querySelector('#rv-day-'+ci).onchange=e=>renderDay(+e.target.value);
    panel.appendChild(body);
    p.appendChild(panel);
    if(days.length) renderDay(0); else body.appendChild(el('div','empty','Sin revisiones para este cliente.'));
  });

  if(!sub.length)
    p.appendChild(el('div','placeholder','<h2>Sin datos</h2><p class="muted">No hay revision semanal para '+(CURRENT||'-')+'.</p>'));
}
function renderHeldQueue(brand,day,uid){var rows=(day&&day.held)||[];if(!rows.length)return '';var neg=((DATA.negatives&&DATA.negatives.clients)||[]).filter(function(x){return x.brand_name===brand;})[0]||{};var lines=((neg.products)||[]).map(function(p){return p.name;}).filter(function(n){return n&&n!=='General (sin asignar)';});if(!lines.length)return '';var opt=function(sel){return lines.map(function(n){return '<option value="'+escapeHtml(n)+'"'+(n===sel?' selected':'')+'>'+escapeHtml(n)+'</option>';}).join('');};var b=rows.slice().sort(function(a,b){return (b.spend||0)-(a.spend||0);}).map(function(r,i){var cid='hp_'+uid+'_'+i,sid='hpline_'+uid+'_'+i;return '<tr><td><input type="checkbox" class="hpcb-'+uid+'" id="'+cid+'" data-i="'+i+'" data-term="'+escapeHtml(r.term)+'" data-match="'+escapeHtml(r.match||'')+'" data-reason="'+escapeHtml(r.reason||'')+'"></td><td class="term">'+escapeHtml(r.term)+'</td><td class="num">'+(r.clicks!=null?r.clicks:'-')+'</td><td class="num">'+(r.spend!=null?escapeHtml(String(r.spend)):'-')+'</td><td>'+escapeHtml(r.match||'')+'</td><td><select id="'+sid+'">'+opt(r.suggested_line||'')+'</select></td></tr>';}).join('');return '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin:12px 0 4px"><div style="font-weight:600;color:var(--amber)">Assign line &amp; push ('+rows.length+')</div><div style="display:flex;gap:8px;align-items:center"><button class="btn small" onclick="hpAll(\''+uid+'\',true)">Select all</button><button class="btn small" onclick="hpAll(\''+uid+'\',false)">Clear</button><button class="btn small" data-uid="'+uid+'" data-brand="'+escapeHtml(brand)+'" onclick="hpCopy(this)">Copy assigned</button><span class="dim" id="hpmsg-'+uid+'" style="font-size:12px"></span></div></div><div style="overflow-x:auto"><table><thead><tr><th></th><th class="term">Term</th><th class="num">Clk</th><th class="num">Spend</th><th>Match</th><th>Assign line</th></tr></thead><tbody>'+b+'</tbody></table></div><div class="note" style="margin-top:8px">Pick a line per term, tick the ones to apply, hit <b>Copy assigned</b>, then paste in chat: <b>pushear aprobados de '+escapeHtml(brand)+'</b>.</div>';}
function hpAll(uid,on){document.querySelectorAll('.hpcb-'+uid).forEach(function(cb){cb.checked=on;});}
function hpCopy(btn){var uid=btn.getAttribute('data-uid');var brand=btn.getAttribute('data-brand');var ck=Array.prototype.slice.call(document.querySelectorAll('.hpcb-'+uid)).filter(function(cb){return cb.checked;});var m=document.getElementById('hpmsg-'+uid);if(!ck.length){if(m)m.textContent='Nothing selected.';return;}var lines=ck.map(function(cb){var s=document.getElementById('hpline_'+uid+'_'+cb.getAttribute('data-i'));var ln=s?s.value:'';return [cb.dataset.term,cb.dataset.match,cb.dataset.reason,ln].join('\t');});var block=lines.join('\n');var done=function(){if(m)m.textContent=ck.length+' copied - paste: pushear aprobados de '+brand;};if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(block).then(done,function(){aqFb(block,done);});}else{aqFb(block,done);}}
function renderApprovalQueue(brand,day,uid){var rows=(day&&day.held_low_confidence)||[];if(!rows.length)return '';var b=rows.map(function(r,i){var id='aq_'+uid+'_'+i;return '<tr><td><input type="checkbox" class="aqcb-'+uid+'" id="'+id+'" data-term="'+escapeHtml(r.term)+'" data-match="'+escapeHtml(r.match||'')+'" data-reason="'+escapeHtml(r.reason||'')+'" data-product="'+escapeHtml(r.product||'')+'"></td><td class="term"><label for="'+id+'">'+escapeHtml(r.term)+'</label></td><td class="num">'+(r.clicks!=null?r.clicks:'-')+'</td><td class="num">'+(r.spend!=null?escapeHtml(String(r.spend)):'-')+'</td><td>'+escapeHtml(r.match||'')+'</td><td>'+escapeHtml(r.product||'')+'</td><td class="dim">'+escapeHtml(r.evidence||r.reason||'')+'</td></tr>';}).join('');return '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin:16px 0 4px"><div style="font-weight:600;color:var(--amber)">Low confidence - approve to push ('+rows.length+')</div><div style="display:flex;gap:8px;align-items:center"><button class="btn small" onclick="aqAll(\''+uid+'\',true)">Select all</button><button class="btn small" onclick="aqAll(\''+uid+'\',false)">Clear</button><button class="btn small" data-uid="'+uid+'" data-brand="'+escapeHtml(brand)+'" onclick="aqCopy(this)">Copy approved</button><span class="dim" id="aqmsg-'+uid+'" style="font-size:12px"></span></div></div><div style="overflow-x:auto"><table><thead><tr><th></th><th class="term">Term</th><th class="num">Clk</th><th class="num">Spend</th><th>Match</th><th>Product</th><th>Evidence</th></tr></thead><tbody>'+b+'</tbody></table></div><div class="note" style="margin-top:8px">Tick the ones you approve, hit <b>Copy approved</b>, then paste in chat: <b>pushear low aprobados de '+escapeHtml(brand)+'</b>.</div>';}
function aqAll(uid,on){document.querySelectorAll('.aqcb-'+uid).forEach(function(cb){cb.checked=on;});}
function aqCopy(btn){var uid=btn.getAttribute('data-uid');var brand=btn.getAttribute('data-brand');var ck=Array.prototype.slice.call(document.querySelectorAll('.aqcb-'+uid)).filter(function(cb){return cb.checked;});var m=document.getElementById('aqmsg-'+uid);if(!ck.length){if(m)m.textContent='Nothing selected.';return;}var block=ck.map(function(cb){return [cb.dataset.term,cb.dataset.match,cb.dataset.reason,cb.dataset.product].join('\t');}).join('\n');var done=function(){if(m)m.textContent=ck.length+' copied - paste: pushear low aprobados de '+brand;};if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(block).then(done,function(){aqFb(block,done);});}else{aqFb(block,done);}}
function aqFb(text,cb){var ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');}catch(e){}document.body.removeChild(ta);if(cb)cb();}
function renderPush(){
  const p=$('#page-push'); if(!p) return; p.innerHTML='';
  const P=DATA.push||{clients:[]};
  const intro=el('div'); intro.style.cssText='margin-bottom:14px;color:var(--mut);font-size:13px';
  intro.innerHTML='Daily <b>autopush</b> report: negatives that were applied automatically to AdLabs, and the '+
    '<b>held</b> ones with no assigned product (<b>General - unassigned</b>) that need your '+
    'decision. Choose the day. Held items show clicks, spend, the source campaign/ad-group and a '+
    '<b>suggested line</b> to help you decide which product to assign them to.' + '<details style="margin-top:10px"><summary style="cursor:pointer;font-weight:600">How this works (negatives flow)</summary><div style="margin-top:6px;line-height:1.5"><b>Auto-pushed</b> (high &amp; medium confidence): applied to AdLabs automatically, per product line - see the "Pushed to AdLabs" list. <b>Low confidence</b>: NOT pushed - review "Low confidence - approve to push", tick what you agree with, hit <b>Copy approved</b>, and paste in chat <b>pushear aprobados de [Brand]</b>. Approving also teaches the profile so next time it auto-pushes. <b>Held - decide product</b>: irrelevant but the product line was not resolvable - in "Assign line &amp; push" pick a line per term, tick, hit <b>Copy assigned</b>, and paste the same command. <b>ASINs</b>: never auto-negated - review by hand. Listing changed? Refresh its fiche in chat: <b>actualizar ficha de [producto] de [Brand]</b>.</div></details>';
  p.appendChild(intro);

  const sub=(P.clients||[]).filter(c=>c.brand_name===CURRENT);
  sub.forEach((c,ci)=>{
    const cp=c.currency_prefix||'$';
    const days=(c.days||[]).slice();               // new -> old
    const panel=el('div','client');

    // -- header ------------------------------------------------
    const head=el('div','head');
    head.innerHTML=`<div><div class="name">${escapeHtml(c.brand_name)}<span class="mkt">${c.marketplace||''}</span></div>
      <div class="prod">Daily autopush - negatives applied and held</div></div>
      <div class="kpis">
        <div class="kpi"><div class="n green" id="pu-cre-${ci}">-</div><div class="l">Created</div></div>
        <div class="kpi"><div class="n amber" id="pu-held-${ci}">-</div><div class="l">Held</div></div>
        <div class="kpi"><div class="n teal" id="pu-hs-${ci}">-</div><div class="l">Spend held</div></div>
      </div>`;
    panel.appendChild(head);

    // -- day selector -----------------------------------------
    const bar=el('div','daybar');
    const dopts=days.map((d,di)=>`<option value="${di}">${d.date_iso||('day '+(di+1))}${di===0?' (today)':''}</option>`).join('');
    bar.innerHTML=`<span class="lbl">Day</span><select class="daysel" id="pu-day-${ci}">${dopts}</select>
      <span class="meta" id="pu-meta-${ci}"></span>`;
    panel.appendChild(bar);

    const body=el('div'); body.id='pu-body-'+ci; panel.appendChild(body);

    function renderDay(di){
      const d=days[di]||{}; const s=d.summary||{};
      const applied=d.applied||[], held=d.held||[], asins=d.asins_skipped||[], dropped=d.dropped||[];
      $('#pu-cre-'+ci).textContent=(s.created!=null?s.created:applied.reduce((a,x)=>a+(x.created||0),0));
      $('#pu-held-'+ci).textContent=(s.held!=null?s.held:held.length);
      const heldSpend=(s.held_spend!=null?s.held_spend:held.reduce((a,x)=>a+(x.spend||0),0));
      $('#pu-hs-'+ci).textContent=money(heldSpend,cp);
      $('#pu-meta-'+ci).textContent=(d.data_window?('Data: '+d.data_window+' - '):'')+
        `${applied.length} applied - ${held.length} held - ${asins.length} ASINs - ${dropped.length} discarded`;

      body.innerHTML='';

      // --- APPLIED ---
      const h1=el('div'); h1.style.cssText='font-weight:600;margin:6px 0 4px'; h1.innerHTML='Pushed to AdLabs';
      body.appendChild(h1);
      if(applied.length){
        const tw=el('div'); tw.style.overflowX='auto';
        const t=el('table');
        t.innerHTML='<thead><tr><th class="term">Term</th><th class="num">Clk</th><th class="num">Spend</th>'+
          '<th>Negated as</th><th>Product / line</th><th class="num">Ad groups</th>'+
          '<th class="num">Created</th><th class="num">Already existed</th></tr></thead>';
        const tb=el('tbody');
        applied.forEach(x=>tb.appendChild(el('tr','',
          `<td class="term">${escapeHtml(x.term)}</td><td class="num">${x.clicks!=null?x.clicks:'-'}</td>`+
          `<td class="num">${money(x.spend,cp)}</td><td>${escapeHtml(x.match||'')}</td>`+
          `<td>${escapeHtml(x.line||'')}</td><td class="num">${x.ad_groups!=null?x.ad_groups:'-'}</td>`+
          `<td class="num">${x.created!=null?x.created:'-'}</td><td class="num dim">${x.skipped!=null?x.skipped:'-'}</td>`)));
        t.appendChild(tb); tw.appendChild(t); body.appendChild(tw);
      } else body.appendChild(el('div','empty','Nothing pushed this day.'));

      // --- HELD (General) - actionable ---
      const h2=el('div'); h2.style.cssText='font-weight:600;margin:16px 0 4px;color:var(--amber)';
      h2.innerHTML=`Held - decide product (${held.length})`;
      body.appendChild(h2);
      if(held.length){
        const tw2=el('div'); tw2.style.overflowX='auto';
        const t2=el('table');
        t2.innerHTML='<thead><tr><th class="term">Term</th><th class="num">Clk</th><th class="num">Spend</th>'+
          '<th>Type</th><th>Match</th><th>Source campaign</th><th>Ad group</th>'+
          '<th>Suggested line</th><th>Reason</th></tr></thead>';
        const tb2=el('tbody');
        held.slice().sort((a,b)=>(b.spend||0)-(a.spend||0)).forEach(x=>tb2.appendChild(el('tr','',
          `<td class="term">${escapeHtml(x.term)}</td><td class="num">${x.clicks!=null?x.clicks:'-'}</td>`+
          `<td class="num">${money(x.spend,cp)}</td><td>${escapeHtml(x.kind||'')}</td>`+
          `<td>${escapeHtml(x.match||'')}</td><td class="dim">${escapeHtml(x.origin_campaign||'-')}</td>`+
          `<td class="dim">${escapeHtml(x.origin_ad_group||'-')}</td>`+
          `<td>${x.suggested_line?('<b>'+escapeHtml(x.suggested_line)+'</b>'):'<span class="dim">no suggestion</span>'}</td>`+
          `<td class="dim">${escapeHtml(x.reason||'')}</td>`)));
        t2.appendChild(tb2); tw2.appendChild(t2); body.appendChild(tw2);
        const hint=el('div','note'); hint.style.marginTop='8px';
        hint.innerHTML='To apply a held item: assign the line in the product onboarding/config (or say in a '+
          'chat: <b>"assign these terms to line X in '+escapeHtml(c.brand_name)+' y pushealos"</b>) y corre '+
          'the autopush again - once the product is resolvable it applies them.';
        body.appendChild(hint); { var hqw=el('div'); hqw.innerHTML=renderHeldQueue(c.brand_name,d,ci+'_'+di); if(hqw.innerHTML) body.appendChild(hqw); }
      } else body.appendChild(el('div','empty','No held items this day. Everything could be assigned and pushed.'));

      // --- LOW confidence - approval queue ---
      { var aqw=el('div'); aqw.innerHTML=renderApprovalQueue(c.brand_name,d,ci+'_'+di); if(aqw.innerHTML) body.appendChild(aqw); }
      // --- ASINs (not auto-negated) - decide manually ---
      const h4=el('div'); h4.style.cssText='font-weight:600;margin:16px 0 4px;color:var(--blue)';
      h4.innerHTML=`ASINs detected - not auto-negated (${asins.length})`;
      body.appendChild(h4);
      if(asins.length){
        const tw3=el('div'); tw3.style.overflowX='auto';
        const t3=el('table');
        t3.innerHTML='<thead><tr><th class="term">ASIN</th><th class="num">Clk</th><th class="num">Spend</th>'+
          '<th>Product / line</th><th>Source campaign</th><th>Ad group</th><th>Reason</th></tr></thead>';
        const tb3=el('tbody');
        asins.slice().sort((a,b)=>(b.spend||0)-(a.spend||0)).forEach(x=>tb3.appendChild(el('tr','',
          `<td class="term">${escapeHtml(x.term)}</td><td class="num">${x.clicks!=null?x.clicks:'-'}</td>`+
          `<td class="num">${money(x.spend,cp)}</td><td>${escapeHtml(x.product||'')}</td>`+
          `<td class="dim">${escapeHtml(x.origin_campaign||'-')}</td><td class="dim">${escapeHtml(x.origin_ad_group||'-')}</td>`+
          `<td class="dim">${escapeHtml(x.reason||'ASIN - not auto-negated')}</td>`)));
        t3.appendChild(tb3); tw3.appendChild(t3); body.appendChild(tw3);
        const hintA=el('div','note'); hintA.style.marginTop='8px';
        hintA.innerHTML='ASINs (b0... terms) are NOT auto-negated by rule. If you want to negate one as '+
          'product target, say: <b>"negate the ASIN b0... in '+escapeHtml(c.brand_name)+'"</b> (via adlabs-push-negatives).';
        body.appendChild(hintA);
      } else body.appendChild(el('div','empty','No ASINs detected this day.'));

      // --- DISCARDED (safety net) - summary ---
      if(dropped.length){
        const h3=el('div'); h3.style.cssText='font-weight:600;margin:16px 0 4px;color:var(--dim)';
        h3.innerHTML=`Discarded by safety net (${dropped.length})`;
        body.appendChild(h3);
        const chips=el('div'); chips.style.cssText='display:flex;flex-wrap:wrap;gap:6px';
        dropped.forEach(x=>{const ch=el('span','chip'); ch.textContent=`${x.term} (${x.reason})`; chips.appendChild(ch);});
        body.appendChild(chips);
      }
    }

    bar.querySelector('#pu-day-'+ci).onchange=e=>renderDay(+e.target.value);
    panel.appendChild(body);
    p.appendChild(panel);
    if(days.length) renderDay(0); else body.appendChild(el('div','empty','No push receipts for this client.'));
  });

  if(!sub.length)
    p.appendChild(el('div','placeholder','<h2>No data</h2><p class="muted">No push report for '+(CURRENT||'-')+'.</p>'));
}

function renderPlaceholder(id,title,txt){$('#page-'+id).appendChild(el('div','placeholder',`<h2>${title}</h2><p class="muted">${txt}</p>`));}

$('#gen').textContent=DATA.meta&&DATA.meta.generated?('Updated: '+DATA.meta.generated):'';
buildTabs(); buildClientSelector(); renderDaily(); renderNegatives(); renderPush(); renderReview(); renderHarvest(); renderRestock(); renderOptimizations(); highlightDaily();
</script>
