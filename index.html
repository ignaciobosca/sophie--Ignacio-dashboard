/* union across the client's days (deduped by term) */
function isAsinTerm(t){return /^b0[a-z0-9]{8}$/i.test(t||'');}
function kindOf(k){return k.kind||(isAsinTerm(k.term)?'asin':'keyword');}
function prodOf(k){return k.product||'General (sin asignar)';}
function negProducts(c){
  if(c.products&&c.products.length) return c.products.map(p=>p.name||p);
  const s=new Set(); (c.days||[]).forEach(d=>(d.candidates||[]).forEach(k=>s.add(prodOf(k)))); return [...s];
}
function unionOf(c){
  const days=c.days||[]; const map=new Map();
  days.forEach(d=>{(d.candidates||[]).forEach(k=>{
    const key=k.term.toLowerCase();
    if(!map.has(key)){
      map.set(key,{term:k.term,clicks:k.clicks,spend:k.spend,match:k.match,root:k.root,reason:k.reason,
        kind:kindOf(k),product:prodOf(k),days_count:1,first_seen:d.date_label,last_seen:d.date_label});
    }else{
      const u=map.get(key); u.clicks+=k.clicks; u.spend=+(u.spend+k.spend).toFixed(2);
      u.days_count++; u.first_seen=d.date_label;
    }
  })});
  return [...map.values()].sort((a,b)=>b.spend-a.spend);
}

    bar.querySelectorAll('#daychks-'+ci+' input[data-day]').forEach(x=>x.onchange=()=>selectView(ci,c));
    bar.querySelectorAll('[data-days]').forEach(b=>b.onclick=()=>{const v=b.dataset.days==='all';bar.querySelectorAll('#daychks-'+ci+' input[data-day]').forEach(x=>x.checked=v);selectView(ci,c);});
    bar.querySelector('#kind-'+ci).onchange=()=>selectView(ci,c);
    bar.querySelector('#prod-'+ci).onchange=()=>selectView(ci,c);
    ctr.querySelector('[data-gen]').onclick=()=>genBlocks(ci,c);
    ctr.querySelectorAll('[data-all]').forEach(b=>b.onclick=()=>{
      const v=b.dataset.all==='1';
      panel.querySelectorAll('tbody tr').forEach(tr=>{const cb=tr.querySelector('[data-cb]');if(cb){cb.checked=v;tr.classList.toggle('off',!v);}});
      updSel(ci,c);
    });
    out.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>copyTa(b.dataset.copy,b));

    c._panel=panel;
    p.appendChild(panel);
    selectView(ci,c);  // default: union
  });

  if(!sub.length)
    p.appendChild(el('div','placeholder','<h2>Sin datos</h2><p class="muted">No hay negatives para '+(CURRENT||'-')+'.</p>'));
}

function negCheckedDays(ci,c){return [...c._panel.querySelectorAll('#daychks-'+ci+' input[data-day]')].filter(x=>x.checked).map(x=>+x.dataset.day);}
function unionDays(c,idxs){
  const days=c.days||[]; const map=new Map();
  idxs.forEach(i=>{const d=days[i]; if(!d)return; (d.candidates||[]).forEach(k=>{
    const key=k.term.toLowerCase();
    if(!map.has(key)) map.set(key,{term:k.term,clicks:k.clicks,spend:k.spend,match:k.match,root:k.root,reason:k.reason,kind:kindOf(k),product:prodOf(k),days_count:1,first_seen:d.date_label,last_seen:d.date_label});
    else{const u=map.get(key);u.clicks+=k.clicks;u.spend=+(u.spend+k.spend).toFixed(2);u.days_count++;u.first_seen=d.date_label;}
  });});
  return [...map.values()].sort((a,b)=>b.spend-a.spend);
}
function currentList(ci,c){ return unionDays(c, negCheckedDays(ci,c)); }
function selectView(ci,c){
  const cp=c.currency_prefix||'$';
  const idxs=negCheckedDays(ci,c);
  const list=currentList(ci,c); c._view=list;
  list.forEach(k=>{ if(!k.kind)k.kind=kindOf(k); if(!k.product)k.product=prodOf(k); });
  const tb=c._panel.querySelector('tbody'); tb.innerHTML='';
  const multi=idxs.length>1;
  let meta='';
  if(!idxs.length){ meta='Ningun dia marcado - marca al menos uno arriba.'; }
  else if(idxs.length===1){ const d=c.days[idxs[0]]; meta=`${(d&&(d.window_label||d.date_label))||''} - pool del dia: ${(d&&d.pool_total)||0} zero-sale (${money((d&&d.pool_spend)||0,cp)})`; }
  else{ meta=`Union de ${idxs.length} dias marcados - ${list.length} terminos (deduplicados)`; }
  $('#daymeta-'+ci).textContent=meta;

  const kf=$('#kind-'+ci).value, pf=$('#prod-'+ci).value;
  const rows=list.map((k,ki)=>({k,ki})).filter(o=>(kf==='__all'||o.k.kind===kf)&&(pf==='__all'||o.k.product===pf));

  const mkRow=(o)=>{
    const k=o.k; const tr=el('tr'); tr.dataset.i=o.ki; const isA=k.kind==='asin';
    const seen = multi && k.days_count ? `<div class="seen">${k.days_count} dia/s - desde ${k.first_seen}</div>` : '';
    const psel=`<select class="prodsel" data-prod>${c._prods.map(n=>`<option ${n===k.product?'selected':''}>${escapeHtml(n)}</option>`).join('')}</select>`;
    const tog=isA?`<span class="reason r-other">product target</span>`
      :`<span class="tog"><button data-m="phrase" class="${k.match==='phrase'?'on':''}">Phrase</button><button data-m="exact" class="${k.match==='exact'?'on ex':''}">Exact</button></span>`;
    tr.innerHTML=`<td><input type="checkbox" checked data-cb></td>
      <td class="term"><div class="t">${escapeHtml(k.term)}</div>${k.root?`<div class="dim" style="font-size:11px">raiz: <b>${escapeHtml(k.root)}</b></div>`:''}${seen}</td>
      <td class="num">${k.clicks}</td><td class="num">${money(k.spend,cp)}</td>
      <td><span class="reason ${REASONCLS(k.reason)}">${k.reason}</span></td>
      <td>${psel}</td><td>${tog}</td>`;
    if(!isA){const toks=tr.querySelectorAll('.tog button');toks.forEach(b=>b.onclick=()=>{k.match=b.dataset.m;toks.forEach(x=>x.classList.remove('on','ex'));b.classList.add('on');if(k.match==='exact')b.classList.add('ex');});}
    const ps=tr.querySelector('[data-prod]'); ps.onchange=()=>{k.product=ps.value;selectView(ci,c);};
    const cb=tr.querySelector('[data-cb]'); cb.onchange=()=>{tr.classList.toggle('off',!cb.checked);updSel(ci,c);};
    return tr;
  };
  const kw=rows.filter(o=>o.k.kind!=='asin'), as=rows.filter(o=>o.k.kind==='asin');
  if(kw.length){const sr=el('tr','secrow');sr.innerHTML=`<td colspan="7">KEYWORDS (${kw.length})</td>`;tb.appendChild(sr);kw.forEach(o=>tb.appendChild(mkRow(o)));}
  if(as.length){const sr=el('tr','secrow');sr.innerHTML=`<td colspan="7">ASINs / product targets (${as.length})</td>`;tb.appendChild(sr);as.forEach(o=>tb.appendChild(mkRow(o)));}
  $('#empty-'+ci).textContent = rows.length? '' : 'Sin candidatos para esta vista/filtros.';
  $('#out-'+ci).classList.remove('show');
  updSel(ci,c);
}
function negRows(c){return [...c._panel.querySelectorAll('tbody tr')].filter(tr=>tr.querySelector('[data-cb]'));}
function selectedRows(ci,c){
  const list=c._view||[];
  return negRows(c).filter(tr=>tr.querySelector('[data-cb]').checked).map(tr=>list[+tr.dataset.i]);
}
function updSel(ci,c){
  const cp=c.currency_prefix||'$'; const dr=negRows(c);
  const sel=dr.filter(tr=>tr.querySelector('[data-cb]').checked).map(tr=>(c._view||[])[+tr.dataset.i]);
  $('#selc-'+ci).textContent=`${sel.length} seleccionados`;
  $('#cnt-'+ci).textContent=dr.length;
  $('#save-'+ci).textContent=money(sel.reduce((a,k)=>a+(k.spend||0),0),cp);
}
function genBlocks(ci,c){
  const rows=selectedRows(ci,c);
  const kw=rows.filter(k=>k.kind!=='asin');
  const phrase=[...new Set(kw.filter(k=>k.match==='phrase').map(k=>((k.root&&k.root.length)?k.root:k.term).toLowerCase().trim()))].sort();
  const exact=[...new Set(kw.filter(k=>k.match==='exact').map(k=>k.term.toLowerCase().trim()))].sort();
  const asins=[...new Set(rows.filter(k=>k.kind==='asin').map(k=>k.term.toUpperCase().trim()))].sort();
  const learn=rows.map(k=>`${k.term}\t${k.kind==='asin'?'asin':k.match}\t${k.reason}\t${k.product}`);
  $('#ph-'+ci).value=phrase.join('\n'); $('#ex-'+ci).value=exact.join('\n'); $('#as-'+ci).value=asins.join('\n'); $('#lr-'+ci).value=learn.join('\n');
  $('#out-'+ci).classList.add('show'); $('#out-'+ci).scrollIntoView({behavior:'smooth',block:'nearest'});
}
function copyTa(id,btn){const ta=$('#'+id);ta.focus();ta.select();try{ta.setSelectionRange(0,999999);}catch(e){}
  const ok=()=>{const o=btn.textContent;btn.textContent='Copiado!';setTimeout(()=>btn.textContent=o,1200);};
  const fb=()=>{try{document.execCommand('copy');ok();}catch(e){btn.textContent='Selecciona y Ctrl+C';setTimeout(()=>btn.textContent='Copiar',1600);}};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(ta.value).then(ok).catch(fb);}else{fb();}}

/* Harvest (interactive, symmetric to Negatives) */
function renderHarvest(){
  const p=$('#page-harvest'); p.innerHTML=''; const H=DATA.harvest||{clients:[]};
  const wd=((H.clients&&H.clients[0]&&H.clients[0].window_days)||30);
  const intro=el('div'); intro.style.cssText='margin-bottom:14px;color:var(--mut);font-size:13px';
  intro.innerHTML=`Search terms que <b>convierten</b> (ACOS &lt;= target) descubiertos en auto/broad, listos para <b>graduar</b> a exact/phrase (o product target si es un ASIN). Elegi como graduar cada uno y genera los bloques para pegar en AdLabs. Ventana: ${wd} dias.`;
  p.appendChild(intro);
  const sub=(H.clients||[]).filter(c=>c.brand_name===CURRENT);
  sub.forEach((c,ci)=>{
    const cp=c.currency_prefix||'$'; const list=c.candidates||[]; c._hview=list;
    const panel=el('div','client');
    panel.appendChild(el('div','head',
      `<div><div class="name">${c.brand_name}<span class="mkt">${c.marketplace||''}</span></div>
        <div class="prod">${c.product_summary||''} - ${c.window_label||''}</div></div>
       <div class="kpis">
         <div class="kpi"><div class="n">${c.pool_total}</div><div class="l">Convierten</div></div>
         <div class="kpi"><div class="n teal">${list.length}</div><div class="l">A graduar</div></div>
         <div class="kpi"><div class="n teal">${money(c.candidates_sales,cp)}</div><div class="l">Ventas 30d en juego</div></div>
       </div>`));
    const ctr=el('div','controls');
    ctr.innerHTML=`<button class="btn small" data-hall="1">Marcar todo</button>
      <button class="btn small" data-hall="0">Desmarcar</button><span class="sp"></span>
      <span class="dim" id="hselc-${ci}"></span>
      <button class="btn primary small" data-hgen="1">Generar copy-paste</button>`;
    panel.appendChild(ctr);
    const tw=el('div'); tw.style.overflowX='auto';
    const table=el('table');
    table.innerHTML=`<thead><tr><th style="width:34px"></th><th class="term">Search term</th>
      <th class="num">Ord</th><th class="num">Clk</th><th class="num">ACOS</th><th class="num">CVR</th><th>Origen</th><th>Graduar como</th></tr></thead>`;
    const tb=el('tbody');
    list.forEach((k,ki)=>{
      const tr=el('tr'); tr.dataset.i=ki; const isAsin=(k.match==='product');
      const tog = isAsin ? `<span class="seen">Product target</span>`
        : `<span class="tog"><button data-hm="exact" class="${k.match==='exact'?'on ex':''}">Exact</button>
             <button data-hm="phrase" class="${k.match==='phrase'?'on':''}">Phrase</button></span>`;
      tr.innerHTML=`<td><input type="checkbox" checked data-hcb></td>
        <td class="term"><div class="t">${escapeHtml(k.term)}</div></td>
        <td class="num">${k.orders}</td><td class="num">${k.clicks}</td>
        <td class="num">${k.acos}%</td><td class="num">${k.cvr}%</td>
        <td><span class="seen">${k.src}</span></td><td>${tog}</td>`;
      if(!isAsin){const toks=tr.querySelectorAll('.tog button');
        toks.forEach(b=>b.onclick=()=>{k.match=b.dataset.hm;toks.forEach(x=>x.classList.remove('on','ex'));
          b.classList.add('on');if(k.match==='exact')b.classList.add('ex');});}
      const cb=tr.querySelector('[data-hcb]');
      cb.onchange=()=>{tr.classList.toggle('off',!cb.checked);updHSel(ci,c);};
      tb.appendChild(tr);
    });
    table.appendChild(tb); tw.appendChild(table); panel.appendChild(tw);
    const out=el('div','out'); out.id='hout-'+ci;
    out.innerHTML=`<div class="grid">
        <div class="block"><h3>GRADUAR A EXACT <button class="btn small" data-copy="hex-${ci}">Copiar</button></h3>
          <textarea id="hex-${ci}" readonly></textarea><div class="note">Crea como <b>keyword exact</b>.</div></div>
        <div class="block"><h3>GRADUAR A PHRASE <button class="btn small" data-copy="hph-${ci}">Copiar</button></h3>
          <textarea id="hph-${ci}" readonly></textarea><div class="note">Crea como <b>keyword phrase</b>.</div></div>
      </div>
      <div class="block" style="margin-top:14px"><h3>PRODUCT TARGETS (ASIN) <button class="btn small" data-copy="hpr-${ci}">Copiar</button></h3>
        <textarea id="hpr-${ci}" readonly></textarea><div class="note">ASINs que convirtieron via auto - gradua como <b>product target</b>.</div></div>`;
    panel.appendChild(out);
    ctr.querySelector('[data-hgen]').onclick=()=>genHarvest(ci,c);
    ctr.querySelectorAll('[data-hall]').forEach(b=>b.onclick=()=>{
      const v=b.dataset.hall==='1';
      tb.querySelectorAll('[data-hcb]').forEach(cb=>{cb.checked=v;cb.closest('tr').classList.toggle('off',!v);});
      updHSel(ci,c);});
    out.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>copyTa(b.dataset.copy,b));
    c._hpanel=panel; p.appendChild(panel); updHSel(ci,c);
  });
  if(!sub.length)
    p.appendChild(el('div','placeholder','<h2>Sin datos</h2><p class="muted">No hay harvest para '+(CURRENT||'-')+'.</p>'));
}
function harvestSelected(ci,c){const rows=[];const list=c._hview||[];
  c._hpanel.querySelectorAll('tbody tr').forEach(tr=>{if(tr.querySelector('[data-hcb]').checked)rows.push(list[+tr.dataset.i]);});return rows;}
function updHSel(ci,c){$('#hselc-'+ci).textContent=`${harvestSelected(ci,c).length} seleccionados`;}
function genHarvest(ci,c){
  const rows=harvestSelected(ci,c);
  const ex=[...new Set(rows.filter(k=>k.match==='exact').map(k=>k.term.toLowerCase().trim()))].sort();
  const ph=[...new Set(rows.filter(k=>k.match==='phrase').map(k=>k.term.toLowerCase().trim()))].sort();
  const pr=[...new Set(rows.filter(k=>k.match==='product').map(k=>k.term.toUpperCase().trim()))].sort();
  $('#hex-'+ci).value=ex.join('\n'); $('#hph-'+ci).value=ph.join('\n'); $('#hpr-'+ci).value=pr.join('\n');
  $('#hout-'+ci).classList.add('show'); $('#hout-'+ci).scrollIntoView({behavior:'smooth',block:'nearest'});
}

/* Restock (read-only) */
function renderRestock(){
  const p=$('#page-restock'); p.innerHTML=''; const R=DATA.restock||{clients:[]};
  const intro=el('div'); intro.style.cssText='margin-bottom:14px;color:var(--mut);font-size:13px';
  intro.innerHTML='Recomendaciones de restock de Amazon (FBA) por print, ordenadas por dias de cobertura. <b>Reorden</b> = Amazon sugiere reponer (con fecha de envio). Read-only; el forecast profundo con sliders vive en el dashboard restock-radar.';
  p.appendChild(intro);
  const rmoney=(v,cp)=>v==null?'-':cp+Number(v).toLocaleString('en-US',{maximumFractionDigits:0});
  const sub=(R.clients||[]).filter(c=>c.brand_name===CURRENT);
  sub.forEach(c=>{
    const cp=c.currency_prefix||'$';
    const panel=el('div','client');
    panel.appendChild(el('div','head',
      `<div><div class="name">${c.brand_name}<span class="mkt">${c.marketplace||''}</span></div>
        <div class="prod">${c.product_summary||''}${R.snapshot_date?' - snapshot '+R.snapshot_date:''}</div></div>
       <div class="kpis">
         <div class="kpi"><div class="n">${c.skus_total}</div><div class="l">SKUs</div></div>
         <div class="kpi"><div class="n amber">${c.reorder_now}</div><div class="l">A reordenar</div></div>
         <div class="kpi"><div class="n ${c.lowest_cover<30?'red':'teal'}">${c.lowest_cover}d</div><div class="l">Menor cobertura</div></div>
       </div>`));
    const tw=el('div'); tw.style.overflowX='auto';
    const table=el('table');
    table.innerHTML=`<thead><tr><th>Print</th><th>ASIN</th><th class="num">Stock</th><th class="num">Cobertura</th><th class="num">Ventas 30d</th><th class="num">Reorden</th><th>Enviar antes</th></tr></thead>`;
    const tb=el('tbody');
    (c.items||[]).forEach(it=>{
      const dos=it.days_of_supply;
      const covcls = it.risk==='reorder'?'rk-reorder':(dos!=null&&dos<60?'rk-watch':'rk-ok');
      tb.appendChild(el('tr','',
        `<td><b>${escapeHtml(it.name)}</b></td><td class="dim">${it.asin}</td>`+
        `<td class="num">${it.available}</td>`+
        `<td class="num"><span class="rk ${covcls}">${dos!=null?dos+'d':'-'}</span></td>`+
        `<td class="num">${rmoney(it.sales_30d,cp)}</td>`+
        `<td class="num">${it.recommended_qty>0?'<b>'+it.recommended_qty+'</b>':'-'}</td>`+
        `<td>${(it.recommended_ship_date&&it.recommended_ship_date!=='none')?it.recommended_ship_date:'-'}</td>`));
    });
    table.appendChild(tb); tw.appendChild(table); panel.appendChild(tw);
    p.appendChild(panel);
  });
  if(!sub.length) p.appendChild(el('div','placeholder','<h2>Sin datos</h2><p class="muted">No hay restock para '+(CURRENT||'-')+'.</p>'));
}

$('#gen').textContent=DATA.meta&&DATA.meta.generated?('Actualizado: '+DATA.meta.generated):'';
buildTabs(); buildClientSelector(); renderDaily(); renderNegatives(); renderHarvest(); renderRestock(); highlightDaily();
</script>
